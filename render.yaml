services:
  - type: web
    name: stock-tracker
    env: python
    region: oregon  # 可选: singapore 离中国更近
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LOG_LEVEL
        value: INFO
    autoDeploy: true
